name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          TAG_NAME="v${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Write release notes
        run: |
          cat > build/release-notes.md <<'NOTES'
          Download the zip, unzip it, and open `RightClickFocus.app`.

          On first launch, grant Accessibility and Input Monitoring permissions in System Settings.

          This build is ad-hoc signed by GitHub Actions. Use the local notarized release scripts for public distribution.
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              "build/RightClickFocus-$VERSION.zip" \
              "build/RightClickFocus-$VERSION.zip.sha256" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              "build/RightClickFocus-$VERSION.zip" \
              "build/RightClickFocus-$VERSION.zip.sha256" \
              --title "RightClickFocus $TAG_NAME" \
              --notes-file build/release-notes.md \
              --verify-tag
          fi
